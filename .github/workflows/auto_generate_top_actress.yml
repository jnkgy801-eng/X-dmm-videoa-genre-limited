name: DMM人気出演者URL・X投稿ジェネレーター

on:
  # 手動実行（細かいオプション指定はこちら）
  workflow_dispatch:
    inputs:
      dmm_floor:
        description: 'フロア種別（人気ランキング集計の対象フロア）'
        required: false
        default: 'videoa'
        type: choice
        options:
          - videoa
          - videoc
          - anime
          - doujin
          - comic
          - goods
      rank_sample_size:
        description: '人気ランキング集計に使う人気作品の取得件数'
        required: false
        default: '200'
        type: string
      top_actress_count:
        description: '投稿対象にする人気出演者の人数'
        required: false
        default: '3'
        type: string
      auto_post_to_x:
        description: 'Buffer経由でXに自動投稿（予約投稿）する（デフォルトON）'
        required: false
        default: true
        type: boolean

  # 1日1回・日本時間19:00に実行（メイン投稿の20:00より少し前に人気出演者を紹介する想定）
  # cron はUTC基準のため、JST 19:00 = UTC 10:00 で指定している。
  schedule:
    - cron: '0 10 * * *'   # 日本時間 19:00頃

jobs:
  generate-top-actress-posts:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3

      - name: Pythonのセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 人気出演者URLの投稿文を生成（＋設定により自動投稿も実行）
        env:
          DMM_API_ID:           ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID:     ${{ secrets.DMM_AFFILIATE_ID }}
          DMM_FLOOR:            ${{ github.event.inputs.dmm_floor || 'videoa' }}
          RANK_SAMPLE_SIZE:     ${{ github.event.inputs.rank_sample_size || '200' }}
          TOP_ACTRESS_COUNT:    ${{ github.event.inputs.top_actress_count || '3' }}
          SAVE_TO_REPO:         'true'
          AUTO_POST_TO_X:       ${{ github.event.inputs.auto_post_to_x || 'true' }}
          # Buffer経由の自動投稿で使用：BufferのAPI設定ページで発行したPersonal API Keyと
          # buffer_channel_setup.py で確認したチャンネルID（メイン投稿と共通のシークレットを使用）
          BUFFER_API_KEY:       ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID:    ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python dmm_top_actress_url_poster.py

      - name: 生成したTXTをリポジトリにコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動生成: 人気出演者URL投稿テキスト更新 ($(date +'%Y-%m-%d %H:%M:%S'))" && git push)
